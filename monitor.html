<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MiMo Token 用量监控</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f5f6fa;--card:#fff;--accent:#4361ee;--accent2:#f72585;--text:#1a1a2e;--sub:#6c757d;--border:#e9ecef;--success:#06d6a0;--warn:#ffd166;--danger:#ef476f}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.header{background:linear-gradient(135deg,#1a1a2e 0%,#16213e 100%);color:#fff;padding:20px 32px;display:flex;align-items:center;justify-content:space-between}
.header h1{font-size:22px;font-weight:600}
.header .status{display:flex;align-items:center;gap:8px;font-size:13px;opacity:.8}
.header .dot{width:8px;height:8px;border-radius:50%;background:var(--success);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.refresh-btn{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;padding:6px 14px;border-radius:8px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px;transition:background .2s}
.refresh-btn:hover{background:rgba(255,255,255,.25)}
.refresh-btn:disabled{opacity:.5;cursor:not-allowed}
.refresh-btn .spin{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.container{max-width:1200px;margin:0 auto;padding:24px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.card{background:var(--card);border-radius:12px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.08);min-height:110px;display:flex;flex-direction:column;justify-content:center}
.card .label{font-size:13px;color:var(--sub);margin-bottom:6px}
.card .value{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.card .sub{font-size:12px;color:var(--sub);margin-top:4px}
.card.plan .value{color:var(--accent)}
.card.used .value{color:var(--accent2)}
.card.remain .value{color:var(--success)}
.card.expire .value{font-size:20px;color:var(--warn)}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px}
.chart-box{background:var(--card);border-radius:12px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.chart-box h3{font-size:15px;margin-bottom:16px;color:var(--text)}
.chart-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.chart-header h3{margin-bottom:0}
.toggle-group{display:flex;background:#e9ecef;border-radius:8px;padding:2px}
.toggle-btn{padding:4px 12px;border:none;border-radius:6px;font-size:12px;cursor:pointer;background:transparent;color:var(--sub);transition:all .2s}
.toggle-btn.active{background:#fff;color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.progress-wrap{background:var(--card);border-radius:12px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:24px}
.progress-wrap h3{font-size:15px;margin-bottom:12px}
.progress-bar{height:28px;background:#e9ecef;border-radius:14px;overflow:hidden;position:relative}
.progress-fill{height:100%;border-radius:14px;transition:width .6s ease;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.progress-text{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:13px;font-weight:600;color:var(--text)}
.cookie-section{background:var(--card);border-radius:12px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:24px}
.cookie-section h3{font-size:15px;margin-bottom:8px}
.cookie-section p{font-size:13px;color:var(--sub);margin-bottom:12px}
.cookie-section textarea{width:100%;height:60px;border:1px solid var(--border);border-radius:8px;padding:10px;font-size:13px;font-family:monospace;resize:vertical}
.cookie-section button{margin-top:8px;padding:8px 20px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-size:13px;cursor:pointer}
.cookie-section button:hover{opacity:.9}
.footer{text-align:center;padding:16px;color:var(--sub);font-size:12px}
.error-banner{background:#fff3cd;border:1px solid #ffc107;border-radius:8px;padding:12px 16px;margin-bottom:16px;font-size:13px;color:#856404;display:none}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#1a1a2e;color:#fff;padding:10px 24px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999}
.toast.show{opacity:1}
@media(max-width:768px){
  .header{padding:12px 16px;gap:12px;position:sticky;top:0;z-index:100}
  .header h1{font-size:17px;white-space:nowrap}
  .refresh-btn{padding:5px 10px;font-size:12px}
  .container{padding:14px 10px}
  .cards{grid-template-columns:1fr 1fr;gap:8px}
  .card{padding:12px 10px;overflow:hidden}
  .card .value{font-size:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .card .label{font-size:11px;margin-bottom:4px}
  .card .sub{font-size:11px;margin-top:2px}
  .card.expire .value{font-size:16px}
  .charts{grid-template-columns:1fr;gap:10px}
  .chart-box{padding:12px}
  .chart-header{margin-bottom:10px}
  .chart-header h3{font-size:13px}
  .toggle-btn{padding:3px 8px;font-size:11px}
  .progress-wrap{padding:12px}
  .progress-wrap h3{font-size:13px}
  .progress-bar{height:22px}
  .progress-text{font-size:10px;right:8px}
  .cookie-section{padding:12px}
  .footer{font-size:11px;padding:12px}
}
</style>
</head>
<body>
<div class="header">
  <h1>MiMo Token 用量监控</h1>
  <div class="status">
    <button class="refresh-btn" id="refreshBtn" onclick="manualRefresh()">
      <span id="refreshIcon">&#x21bb;</span> 刷新
    </button>
    <span class="dot" id="statusDot"></span>
    <span id="statusText">连接中...</span>
  </div>
</div>
<div class="container">
  <div class="error-banner" id="errorBanner"></div>

  <div class="cards">
    <div class="card used">
      <div class="label">已使用</div>
      <div class="value" id="usedCredits">--</div>
      <div class="sub" id="usedPercent">--</div>
    </div>
    <div class="card remain">
      <div class="label">剩余</div>
      <div class="value" id="remainCredits">--</div>
      <div class="sub" id="remainDays">--</div>
    </div>
    <div class="card plan">
      <div class="label">套餐</div>
      <div class="value" id="planName">--</div>
      <div class="sub" id="planExpiry">加载中...</div>
    </div>
    <div class="card expire">
      <div class="label">到期时间</div>
      <div class="value" id="expireDate">--</div>
      <div class="sub" id="expireCountdown">--</div>
    </div>
  </div>

  <div class="progress-wrap">
    <h3>当前套餐用量</h3>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill" style="width:0%"></div>
      <div class="progress-text" id="progressText">0%</div>
    </div>
  </div>

  <div class="charts">
    <div class="chart-box">
      <div class="chart-header">
        <h3>5分钟用量走势</h3>
        <div class="toggle-group">
          <button class="toggle-btn active" onclick="setTrendMode('total')" id="trendBtnTotal">总量</button>
          <button class="toggle-btn" onclick="setTrendMode('rate')" id="trendBtnRate">每10分钟</button>
        </div>
      </div>
      <canvas id="trendChart"></canvas>
    </div>
    <div class="chart-box">
      <h3>每日消耗量</h3>
      <canvas id="dailyChart"></canvas>
    </div>
  </div>

  <div class="cookie-section">
    <h3>Cookie 设置</h3>
    <p>如果显示 "Cookie 过期" 错误，请从浏览器 F12 → Application → Cookies 中复制以下 Cookie 值粘贴到下方：</p>
    <textarea id="cookieInput" placeholder="格式: api-platform_serviceToken=xxx;api-platform_slh=xxx;api-platform_ph=xxx"></textarea>
    <button onclick="saveCookies()">保存 Cookie</button>
  </div>
</div>
<div class="footer">MiMo Token Monitor v1.0 | 每 5 分钟自动刷新</div>
<div class="toast" id="toast"></div>

<script>
let trendChart, dailyChart;
let trendMode = 'total'; // 'total' or 'rate'
let lastTrendData = null;

function fmt(n) {
  if (n == null) return '--';
  if (n >= 1e9) return (n / 1e9).toFixed(2) + 'B';
  if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
  return String(n);
}

function fmtFull(n) {
  return n == null ? '--' : Number(n).toLocaleString();
}

async function fetchUsage() {
  try {
    const res = await fetch('/api/usage');
    const data = await res.json();
    if (data.error === 'cookie_expired') {
      showError('Cookie 已过期，请在下方重新设置 Cookie');
      setStatus(false);
      return;
    }
    if (!data.detail) return;
    renderDetail(data);
    setStatus(true);
    hideError();
  } catch (e) {
    setStatus(false);
  }
}

async function fetchHistory() {
  try {
    const res = await fetch('/api/history?days=30');
    const history = await res.json();
    renderCharts(history);
  } catch {}
}

function renderDetail(d) {
  const info = d.detail?.data || {};
  const usageInfo = d.usage?.data?.usage?.items?.[0] || {};

  // Plan name
  setText('planName', info.planName || '--');

  // Expiry
  const expiry = info.currentPeriodEnd;
  if (expiry) {
    const expDate = new Date(expiry.replace(' ', 'T'));
    setText('planExpiry', '有效期至 ' + expiry);
    setText('expireDate', expDate.toLocaleDateString('zh-CN'));
    const daysLeft = Math.max(0, Math.ceil((expDate - Date.now()) / 86400000));
    setText('expireCountdown', '剩余 ' + daysLeft + ' 天');
  }

  // Credits from usage API
  const used = usageInfo.used || 0;
  const total = usageInfo.limit || 1600000000;
  const remain = total - used;
  const pct = total > 0 ? (used / total * 100) : 0;

  setText('usedCredits', fmtFull(used));
  setText('usedPercent', pct.toFixed(1) + '% 已使用');
  setText('remainCredits', fmtFull(remain));

  // Progress bar
  document.getElementById('progressFill').style.width = Math.min(pct, 100) + '%';
  setText('progressText', pct.toFixed(1) + '% (' + fmtFull(used) + ' / ' + fmtFull(total) + ')');

}

// Smooth data across time gaps caused by service downtime
function smoothHistory(history, getUsed, gapThresholdMs) {
  if (history.length < 2) return { labels: [], data: [] };
  const labels = [];
  const data = [];
  for (let i = 0; i < history.length; i++) {
    const d = new Date(history[i].ts);
    labels.push(d.getMonth()+1 + '/' + d.getDate() + ' ' + d.getHours() + ':' + String(d.getMinutes()).padStart(2,'0'));
    data.push(Math.round(getUsed(history[i])));
    if (i < history.length - 1) {
      const gap = history[i+1].ts - history[i].ts;
      if (gap > gapThresholdMs) {
        const steps = Math.min(Math.ceil(gap / gapThresholdMs), 50);
        const v0 = data[data.length - 1];
        const v1 = Math.round(getUsed(history[i+1]));
        for (let s = 1; s < steps; s++) {
          const t = s / steps;
          const ts = history[i].ts + gap * t;
          const id = new Date(ts);
          labels.push(id.getMonth()+1 + '/' + id.getDate() + ' ' + id.getHours() + ':' + String(id.getMinutes()).padStart(2,'0'));
          data.push(Math.round(v0 + (v1 - v0) * t));
        }
      }
    }
  }
  return { labels, data };
}

// Downsample: pick one point per minute (last value in each minute bucket)
function downsamplePerMinute(history, getUsed) {
  if (history.length === 0) return [];
  const buckets = new Map();
  for (const h of history) {
    const key = Math.floor(h.ts / 60000) * 60000;
    buckets.set(key, h);
  }
  return Array.from(buckets.values());
}

function renderCharts(history) {
  if (!history || history.length === 0) return;

  const getUsed = (h) => h.usage?.data?.usage?.items?.[0]?.used || 0;
  const gapThreshold = 5 * 60 * 1000; // 5 minutes

  // Filter to last 24 hours for trend chart, then downsample to max 576 points
  const oneDayAgo = Date.now() - 24 * 60 * 60 * 1000;
  let recentHistory = history.filter(h => h.ts > oneDayAgo);
  if (recentHistory.length === 0) recentHistory = history.slice(-10);

  // Downsample: keep at most 576 points evenly spaced (24h * 24 per hour = every 2.5 min)
  if (recentHistory.length > 576) {
    const step = recentHistory.length / 576;
    const sampled = [];
    for (let i = 0; i < 576; i++) {
      sampled.push(recentHistory[Math.min(Math.floor(i * step), recentHistory.length - 1)]);
    }
    recentHistory = sampled;
  }

  const trend = smoothHistory(recentHistory, getUsed, gapThreshold);

  // Compute incremental usage between consecutive points
  const rateData = [];
  for (let i = 0; i < trend.data.length; i++) {
    if (i === 0) { rateData.push(0); continue; }
    const diff = Math.max(0, Math.round(trend.data[i] - trend.data[i - 1]));
    rateData.push(diff);
  }

  lastTrendData = { labels: trend.labels, total: trend.data, rate: rateData };

  const activeData = trendMode === 'total' ? trend.data : rateData;
  const activeLabel = trendMode === 'total' ? '累计使用 Credits' : '每分钟消耗';

  // --- Trend chart: update in place ---
  if (trendChart) {
    trendChart.data.labels = trend.labels;
    trendChart.data.datasets[0].data = activeData;
    trendChart.data.datasets[0].label = activeLabel;
    trendChart.update('none');
  } else {
    trendChart = new Chart(document.getElementById('trendChart'), {
      type: 'line',
      data: {
        labels: trend.labels,
        datasets: [{
          label: activeLabel,
          data: activeData,
          borderColor: '#4361ee',
          backgroundColor: 'rgba(67,97,238,.08)',
          fill: true,
          tension: 0.6,
          borderWidth: 2.5,
          pointRadius: 0,
          pointHoverRadius: 5,
          pointHoverBackgroundColor: '#4361ee',
          pointHoverBorderColor: '#fff',
          pointHoverBorderWidth: 2,
        }]
      },
      options: {
        responsive: true,
        animation: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: ctx => (trendMode === 'total' ? '累计使用: ' : '本段消耗: ') + fmtFull(ctx.parsed.y)
            }
          }
        },
        scales: {
          x: { ticks: { maxTicksLimit: 10, font: { size: 11 } } },
          y: { ticks: { callback: v => fmt(v), font: { size: 11 } } }
        }
      }
    });
  }

  // --- Daily consumption chart ---
  const dailyMap = {};
  for (let i = 1; i < history.length; i++) {
    const prevUsed = getUsed(history[i-1]);
    const currUsed = getUsed(history[i]);
    const diff = Math.max(0, currUsed - prevUsed);
    const day = new Date(history[i].ts).toLocaleDateString('zh-CN');
    dailyMap[day] = (dailyMap[day] || 0) + diff;
  }

  const dailyLabels = Object.keys(dailyMap);
  const dailyData = Object.values(dailyMap);

  if (dailyChart) {
    dailyChart.data.labels = dailyLabels;
    dailyChart.data.datasets[0].data = dailyData;
    dailyChart.update('none');
  } else {
    dailyChart = new Chart(document.getElementById('dailyChart'), {
      type: 'bar',
      data: {
        labels: dailyLabels,
        datasets: [{
          label: '每日消耗',
          data: dailyData,
          backgroundColor: 'rgba(247,37,133,.7)',
          borderRadius: 4,
        }]
      },
      options: {
        responsive: true,
        animation: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { ticks: { font: { size: 11 } } },
          y: { ticks: { callback: v => fmt(v), font: { size: 11 } } }
        }
      }
    });
  }

  // Estimate remaining days from average rate
  if (dailyData.length > 0) {
    const avgDaily = dailyData.reduce((a, b) => a + b, 0) / dailyData.length;
    if (avgDaily > 0) {
      const lastUsed = getUsed(history[history.length-1]);
      const lastLimit = history[history.length-1].usage?.data?.usage?.items?.[0]?.limit || 1600000000;
      const remain = lastLimit - lastUsed;
      const daysLeft = Math.ceil(remain / avgDaily);
      setText('remainDays', '约可用 ' + daysLeft + ' 天');
    }
  }
}

function setTrendMode(mode) {
  trendMode = mode;
  document.getElementById('trendBtnTotal').classList.toggle('active', mode === 'total');
  document.getElementById('trendBtnRate').classList.toggle('active', mode === 'rate');
  if (trendChart && lastTrendData) {
    trendChart.data.datasets[0].data = mode === 'total' ? lastTrendData.total : lastTrendData.rate;
    trendChart.data.datasets[0].label = mode === 'total' ? '累计使用 Credits' : '每分钟消耗';
    trendChart.update('none');
  }
}

function setText(id, text) {
  const el = document.getElementById(id);
  if (el.textContent !== text) el.textContent = text;
}

function setStatus(ok) {
  document.getElementById('statusDot').style.background = ok ? '#06d6a0' : '#ef476f';
  setText('statusText', ok ? '已连接' : '未连接');
}

function showError(msg) {
  const el = document.getElementById('errorBanner');
  el.textContent = msg;
  el.style.display = 'block';
}

function hideError() {
  document.getElementById('errorBanner').style.display = 'none';
}

async function saveCookies() {
  const cookies = document.getElementById('cookieInput').value.trim();
  if (!cookies) return;
  await fetch('/api/cookies', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ cookies })
  });
  setTimeout(fetchUsage, 1000);
}

// Initial load + auto refresh
fetchUsage();
fetchHistory();
setInterval(() => { fetchUsage(); fetchHistory(); }, 5 * 60 * 1000);

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

async function manualRefresh() {
  const btn = document.getElementById('refreshBtn');
  const icon = document.getElementById('refreshIcon');
  btn.disabled = true;
  icon.classList.add('spin');
  try {
    await fetch('/api/refresh');
    await fetchUsage();
    await fetchHistory();
    showToast('刷新成功');
  } catch {}
  btn.disabled = false;
  icon.classList.remove('spin');
}
</script>
</body>
</html>
